name: Daily ArXiv Graph Papers Monitor

on:
  schedule:
    - cron: '0 11 * * *'  # Roda diariamente às 08:00 (Horário de Brasília)
  workflow_dispatch:      # Permite disparar o teste manualmente

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pipeline via Groq
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python main.py